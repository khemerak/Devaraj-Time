# Use together with docker-compose.yml. Requires Docker Compose supporting !reset.
services:
 db:
  ports: !reset []
  restart: unless-stopped
 api:
  ports: !reset []
  environment:
   APP_ENV: production
   COOKIE_SECURE: "true"
   PUBLIC_URL: https://${DOMAIN:?Set DOMAIN}
 web:
  ports: !reset []
 caddy:
  image: caddy:2-alpine
  ports: ["80:80", "443:443"]
  environment:
   DOMAIN: ${DOMAIN:?Set DOMAIN}
   ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
  volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
  depends_on: [web]
  restart: unless-stopped
volumes:
 caddy-data:
 caddy-config:
