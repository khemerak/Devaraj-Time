services:
 db:
  image: postgres:17-alpine
  environment:
   POSTGRES_USER: ${POSTGRES_USER:-devaraj}
   POSTGRES_DB: ${POSTGRES_DB:-devaraj}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  ports: ["127.0.0.1:5432:5432"]
  volumes: ["postgres-data:/var/lib/postgresql/data"]
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
   interval: 5s
   timeout: 3s
   retries: 20
 api:
  build: ./backend
  environment: &api-environment
   DATABASE_URL: postgres://${POSTGRES_USER:-devaraj}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-devaraj}?sslmode=disable
   PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
   APP_ENV: ${APP_ENV:-development}
   COOKIE_SECURE: ${COOKIE_SECURE:-false}
   SMTP_HOST: ${SMTP_HOST:-}
   SMTP_PORT: ${SMTP_PORT:-587}
   SMTP_FROM: ${SMTP_FROM:-}
   SMTP_USER: ${SMTP_USER:-}
   SMTP_PASSWORD: ${SMTP_PASSWORD:-}
   PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-15m}
  depends_on:
   db: {condition: service_healthy}
  ports: ["127.0.0.1:8080:8080"]
  restart: unless-stopped
 web:
  build: ./frontend
  ports: ["5173:8080"]
  depends_on: [api]
  restart: unless-stopped
 migrate:
  build: ./backend
  profiles: ["tools"]
  command: ["-command", "migrate"]
  environment: *api-environment
  depends_on:
   db: {condition: service_healthy}
 seed:
  build: ./backend
  profiles: ["tools"]
  command: ["-command", "seed"]
  environment:
   <<: *api-environment
   DEMO_PASSWORD: ${DEMO_PASSWORD:-}
   DEMO_TIMEZONE: ${DEMO_TIMEZONE:-Asia/Phnom_Penh}
  depends_on:
   db: {condition: service_healthy}
volumes:
 postgres-data:
